name: netball-stats

# Stats runs in its own Compose project. Shared networks come from the netball-vps platform.
services:
  stats-api:
    image: netball-stats-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NETBALL_STATS_REPO_ROOT: /app
      NETBALL_STATS_HOST: 0.0.0.0
      NETBALL_STATS_PORT: "8000"
      NETBALL_STATS_ALLOWED_ORIGINS: https://${STATS_PRIMARY_DOMAIN:?Set STATS_PRIMARY_DOMAIN in the Stats env file}
      NETBALL_STATS_DB_BACKEND: postgres
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      NETBALL_STATS_DB_NAME: netballstats
      NETBALL_STATS_DB_USER: netballstats_api
      NETBALL_STATS_DB_PASSWORD: ${STATS_API_DB_PASSWORD:?Set STATS_API_DB_PASSWORD in the Stats env file}
      NETBALL_STATS_DB_SSLMODE: disable
      NETBALL_STATS_TELEMETRY_DB_HOST: db
      NETBALL_STATS_TELEMETRY_DB_PORT: "5432"
      NETBALL_STATS_TELEMETRY_DB_NAME: netballstats
      NETBALL_STATS_TELEMETRY_DB_USER: netballstats_telemetry_writer
      NETBALL_STATS_TELEMETRY_DB_PASSWORD: ${STATS_TELEMETRY_WRITER_PASSWORD:?Set STATS_TELEMETRY_WRITER_PASSWORD in the Stats env file}
      NETBALL_STATS_TELEMETRY_DB_SSLMODE: disable
      NETBALL_STATS_TRUSTED_PROXY_IPS: 172.30.10.2
      NETBALL_STATS_REQUEST_TELEMETRY: "true"
    healthcheck:
      test: ["CMD", "Rscript", "--no-restore", "--no-save", "-e", "stopifnot(httr::status_code(httr::GET('http://127.0.0.1:8000/health', httr::timeout(2))) == 200L)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: &bounded-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      stats_proxy:
        ipv4_address: 172.30.10.3
      stats_db:
      stats_egress:

  stats-web:
    image: netball-stats-web:vps
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - stats-api
    mem_limit: 128m
    logging: *bounded-logs
    networks:
      edge:
      stats_proxy:
        ipv4_address: 172.30.10.2

  stats-full-refresh:
    profiles: [jobs]
    image: netball-stats-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["Rscript", "--no-restore", "--no-save", "scripts/build_database.R"]
    environment:
      NETBALL_STATS_DB_BACKEND: postgres
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      NETBALL_STATS_DB_NAME: netballstats
      NETBALL_STATS_DB_USER: netballstats_owner
      NETBALL_STATS_DB_PASSWORD: ${STATS_DB_OWNER_PASSWORD:?Set STATS_DB_OWNER_PASSWORD in the Stats env file}
      NETBALL_STATS_DB_SSLMODE: disable
      R_PROFILE: ""
      R_PROFILE_USER: ""
      RENV_PROFILE_ALLOWED: "false"
    mem_limit: 4g
    cpus: 2.0
    logging: *bounded-logs
    networks:
      - stats_db
      - stats_egress

  stats-international-refresh:
    profiles: [jobs]
    image: netball-stats-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["Rscript", "--no-restore", "--no-save", "scripts/build_international_database.R"]
    environment:
      NETBALL_STATS_DB_BACKEND: postgres
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      NETBALL_STATS_DB_NAME: netballstats
      NETBALL_STATS_DB_USER: netballstats_owner
      NETBALL_STATS_DB_PASSWORD: ${STATS_DB_OWNER_PASSWORD:?Set STATS_DB_OWNER_PASSWORD in the Stats env file}
      NETBALL_STATS_DB_SSLMODE: disable
      R_PROFILE: ""
      R_PROFILE_USER: ""
      RENV_PROFILE_ALLOWED: "false"
    mem_limit: 2g
    cpus: 1.0
    logging: *bounded-logs
    networks:
      - stats_db
      - stats_egress

  stats-telemetry-init:
    profiles: [jobs]
    image: netball-stats-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["Rscript", "--no-restore", "--no-save", "scripts/init_telemetry_store.R"]
    environment:
      NETBALL_STATS_DB_HOST: db
      NETBALL_STATS_DB_PORT: "5432"
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in the Stats env file}
      STATS_TELEMETRY_WRITER_PASSWORD: ${STATS_TELEMETRY_WRITER_PASSWORD:?Set STATS_TELEMETRY_WRITER_PASSWORD in the Stats env file}
      STATS_TELEMETRY_REPORT_PASSWORD: ${STATS_TELEMETRY_REPORT_PASSWORD:?Set STATS_TELEMETRY_REPORT_PASSWORD in the Stats env file}
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logs
    networks:
      - stats_db

  stats-telemetry-report:
    profiles: [jobs]
    image: netball-stats-api:vps
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "0:0"
    command: ["Rscript", "--no-restore", "--no-save", "scripts/weekly_usage_report.R"]
    environment:
      NETBALL_STATS_REPO_ROOT: /app
      NETBALL_STATS_TELEMETRY_DB_HOST: db
      NETBALL_STATS_TELEMETRY_DB_PORT: "5432"
      NETBALL_STATS_TELEMETRY_DB_NAME: netballstats
      NETBALL_STATS_TELEMETRY_DB_SSLMODE: disable
      NETBALL_STATS_TELEMETRY_REPORT_USER: netballstats_telemetry_reporter
      NETBALL_STATS_TELEMETRY_REPORT_PASSWORD: ${STATS_TELEMETRY_REPORT_PASSWORD:?Set STATS_TELEMETRY_REPORT_PASSWORD in the Stats env file}
      NETBALL_STATS_TELEMETRY_REPORT_DIR: /reports
    volumes:
      - /opt/netball/reports:/reports
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logs
    networks:
      - stats_db

networks:
  edge:
    name: netball_edge
    external: true
  stats_proxy:
    name: netball_stats_proxy
    external: true
  stats_db:
    name: netball_stats_db
    external: true
  stats_egress:
    name: netball_stats_egress
    external: true
